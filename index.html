<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>5단계 고체류 캐러셀 스튜디오</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Pretendard', sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background: #0b1120; display: flex; justify-content: center; min-height: 100vh; padding: 14px; color: #f8fafc; }
    .app-card { width: 100%; max-width: 480px; background: #1e293b; border-radius: 22px; padding: 20px; box-shadow: 0 10px 40px rgba(0,0,0,0.5); }
    
    .app-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; border-bottom: 1px solid #334155; padding-bottom: 12px; }
    .app-title { font-size: 18px; font-weight: 800; display: flex; align-items: center; gap: 8px; color: #fff; }
    .badge { background: #3b82f6; color: #fff; font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 6px; }

    label { font-size: 13px; font-weight: 700; color: #94a3b8; display: block; margin-top: 14px; margin-bottom: 6px; }
    input[type="text"], textarea { width: 100%; padding: 12px; border: 1.5px solid #334155; border-radius: 12px; font-size: 14px; outline: none; background: #0f172a; color: #fff; }
    input[type="text"]:focus, textarea:focus { border-color: #3b82f6; }

    .btn-run { width: 100%; padding: 16px; background: #2563eb; color: #fff; border: none; border-radius: 12px; font-size: 16px; font-weight: 800; cursor: pointer; margin-top: 14px; box-shadow: 0 4px 16px rgba(37,99,235,0.4); display: flex; align-items: center; justify-content: center; gap: 8px; }
    .btn-run:hover { background: #1d4ed8; }

    .rag-indicator { background: #0f172a; border: 1px solid #334155; border-radius: 10px; padding: 10px; margin-top: 14px; font-size: 12px; color: #38bdf8; display: flex; align-items: center; gap: 6px; }

    .slide-tabs { display: flex; gap: 6px; margin-top: 16px; }
    .slide-tab { flex: 1; padding: 10px 0; background: #334155; border: none; border-radius: 8px; color: #94a3b8; font-size: 12px; font-weight: 700; cursor: pointer; text-align: center; }
    .slide-tab.active { background: #3b82f6; color: #fff; font-weight: 800; }

    .canvas-wrap { margin-top: 12px; border-radius: 14px; overflow: hidden; border: 1.5px solid #334155; line-height: 0; background: #000; box-shadow: 0 4px 20px rgba(0,0,0,0.4); }
    canvas { width: 100%; height: auto; display: block; }

    .ctrl-row { display: flex; justify-content: space-between; align-items: center; margin-top: 14px; font-size: 12px; font-weight: 700; color: #94a3b8; }
    .range-slider { width: 100%; height: 6px; -webkit-appearance: none; background: #334155; border-radius: 3px; outline: none; margin-top: 6px; }
    .range-slider::-webkit-slider-thumb { -webkit-appearance: none; width: 22px; height: 22px; border-radius: 50%; background: #3b82f6; cursor: pointer; }

    .seg-group { display: flex; border: 1px solid #334155; border-radius: 8px; overflow: hidden; margin-top: 6px; }
    .seg-btn { flex: 1; padding: 8px 0; background: #0f172a; border: none; font-size: 12px; font-weight: 600; color: #94a3b8; cursor: pointer; }
    .seg-btn.active { background: #3b82f6; color: #fff; font-weight: 700; }

    .btn-down { width: 100%; padding: 14px; background: #10b981; color: #fff; border: none; border-radius: 12px; font-size: 14px; font-weight: 800; cursor: pointer; margin-top: 12px; }
    .btn-copy { width: 100%; padding: 12px; background: #475569; color: #fff; border: none; border-radius: 12px; font-size: 13px; font-weight: 700; cursor: pointer; margin-top: 8px; }
    
    .caption-box { background: #0f172a; border: 1px solid #334155; border-radius: 12px; padding: 14px; font-size: 13px; line-height: 1.6; color: #cbd5e1; white-space: pre-line; margin-top: 10px; }
  </style>
</head>
<body>

<div class="app-card">
  <div class="app-header">
    <div class="app-title">⚡ 5단계 캐러셀 스튜디오</div>
    <span class="badge">RAG 30 Engine</span>
  </div>

  <label>뉴스 기사 URL 링크 붙여넣기</label>
  <input type="text" id="urlInput" placeholder="https://www.yna.co.kr/view/... 뉴스 링크를 넣으세요">

  <label>또는 기사 내용 직접 붙여넣기</label>
  <textarea id="newsInput" rows="3">혈당 대사에 이상이 있거나 당뇨병이 있는 사람에게서 음주 시 대장암 위험이 급격히 증가한다는 연구 결과가 나왔습니다. 전문가들은 알코올 섭취를 최소화하는 것이 안전하다고 경고했습니다.</textarea>

  <button class="btn-run" onclick="handleGenerate()">
    <span>⚡ 1초 완성: 기사 분석 & 5단계 카드뉴스 생성</span>
  </button>

  <div id="ragTag" class="rag-indicator">
    📖 적용된 마케팅 공식: 로버트 치알디니 《설득의 심리학》 (손실 회피)
  </div>

  <div class="slide-tabs">
    <button class="slide-tab active" onclick="switchSlide(0, this)">1. 후킹</button>
    <button class="slide-tab" onclick="switchSlide(1, this)">2. 문제</button>
    <button class="slide-tab" onclick="switchSlide(2, this)">3. 해결</button>
    <button class="slide-tab" onclick="switchSlide(3, this)">4. 증명</button>
    <button class="slide-tab" onclick="switchSlide(4, this)">5. CTA</button>
  </div>

  <div class="canvas-wrap">
    <canvas id="cardCanvas" width="1080" height="1080"></canvas>
  </div>

  <div class="ctrl-row">
    <span>글자 크기</span>
    <span id="fontSizeDisplay">74px</span>
  </div>
  <input type="range" class="range-slider" min="45" max="95" value="74" oninput="changeFontSize(this.value)">

  <div class="ctrl-row"><span>글자 세로 위치</span></div>
  <div class="seg-group">
    <button class="seg-btn" onclick="setPos('top', this)">위</button>
    <button class="seg-btn" onclick="setPos('center', this)">가운데</button>
    <button class="seg-btn active" onclick="setPos('bottom', this)">아래</button>
  </div>

  <div class="ctrl-row"><span>정렬</span></div>
  <div class="seg-group">
    <button class="seg-btn active" onclick="setAlign('left', this)">왼쪽</button>
    <button class="seg-btn" onclick="setAlign('center', this)">가운데</button>
  </div>

  <button class="btn-down" onclick="downloadCurrentSlide()">💾 현재 슬라이드 이미지 저장</button>

  <label style="margin-top:20px;">인스타그램 본문 캡션</label>
  <div id="captionBox" class="caption-box"></div>
  <button class="btn-copy" onclick="copyCaption()">📋 본문 전체 복사</button>
</div>

<script>
  // 30대 공식 룰셋
  const MARKETING_RULES = [
    {
      category: "건강/위험",
      book: "로버트 치알디니 《설득의 심리학》 (손실 회피)",
      makeSlides: (topic) => [
        { badge: "건강 경고", title: `당뇨·혈당 있다면\n${topic} 절대 금지`, sub: "의학계가 경고하는 충격적인 연구 결과 전격 발표" },
        { badge: "핵심 원인", title: `술 한 잔에 대장암 위험\n급격히 치솟는 이유`, sub: "혈당 대사 이상자가 알코올을 섭취했을 때 벌어지는 체내 반응" },
        { badge: "전문가 진단", title: `알코올과 혈당의 악순환\n3가지 핵심 팩트`, sub: "정상인 대비 발병 확률 대폭 증가, 반드시 알아야 할 메커니즘" },
        { badge: "예방 수칙", title: `지금 당장 멈춰야 할\n식습관 1순위`, sub: "정기 검진과 생활 습관 개선으로 발병 위험 낮추기" },
        { badge: "가족 공유 🔖", title: `부모님·친구에게\n지금 바로 전달하세요`, sub: "모르면 나만 손해 보는 건강 정보, 우측 하단 저장 필수!" }
      ]
    },
    {
      category: "문화/호기심",
      book: "칩 히스 《스틱!》 (호기심 공백)",
      makeSlides: (topic) => [
        { badge: "화제 이슈", title: `${topic},\n정체는?`, sub: "SNS를 발칵 뒤집어 놓은 화제의 실물 전격 공개" },
        { badge: "숨은 비하인드", title: `다들 모르고 지나쳤던\n충격적인 사연`, sub: "단순 해프닝인 줄 알았는데 실제 전시로 이어진 전말" },
        { badge: "핵심 팩트", title: `꼭 챙겨봐야 할\n관람 포인트 3가지`, sub: "전문가들도 감탄한 유물의 숨겨진 가치와 의미" },
        { badge: "현장 정보", title: `관람객 성원으로\n특별 공개 확정`, sub: "실제 관람 가능한 장소와 전시 일정 총정리" },
        { badge: "주말 나들이 🔖", title: `이번 주말 같이 갈 사람?\n@친구태그`, sub: "나중에 찾아보려면 지금 바로 저장(Save)해 두세요!" }
      ]
    }
  ];

  let currentSlides = MARKETING_RULES[0].makeSlides("술 한 잔");
  let currentSlideIndex = 0;
  let currentFontSize = 74;
  let currentPos = 'bottom';
  let currentAlign = 'left';
  let hasCustomImage = false;
  let bgImgElement = null;

  async function handleGenerate() {
    const url = document.getElementById('urlInput').value.trim();
    let text = document.getElementById('newsInput').value.trim();

    if (url) {
      document.getElementById('ragTag').innerText = "⏳ 기사 링크에서 원문을 분석하고 있습니다...";
      try {
        const res = await fetch(`https://r.jina.ai/${url}`);
        if (res.ok) {
          const fetchedText = await res.text();
          text = fetchedText.substring(0, 500);
          document.getElementById('newsInput').value = text;
        }
      } catch (e) {
        console.warn("URL 직접 로드 실패, 본문 텍스트로 즉시 생성합니다.");
      }
    }
    runMarketingRAG(text);
  }

  function runMarketingRAG(text) {
    let matchedRule = MARKETING_RULES[1];
    let topic = "화제의 소식";

    if (text.includes("당뇨") || text.includes("대장암") || text.includes("알코올") || text.includes("술") || text.includes("혈당") || text.includes("위험")) {
      matchedRule = MARKETING_RULES[0];
      topic = text.includes("술") || text.includes("음주") ? "술 한 잔" : "건강 경고";
    } else {
      topic = text.includes("잉어") ? "사람 된 잉어" : "화제의 이슈";
    }

    document.getElementById('ragTag').innerText = `📖 적용된 마케팅 공식: ${matchedRule.book}`;
    currentSlides = matchedRule.makeSlides(topic);
    drawCanvas();
    updateCaption();
  }

  function drawCanvas() {
    const canvas = document.getElementById('cardCanvas');
    const ctx = canvas.getContext('2d');
    const slide = currentSlides[currentSlideIndex];

    // 1. 기본 배경 렌더링 (이미지가 없거나 깨져도 절대 검은 화면이 되지 않도록 다크 그라데이션 보장)
    if (hasCustomImage && bgImgElement) {
      try {
        ctx.drawImage(bgImgElement, 0, 0, 1080, 1080);
      } catch(e) {
        fillFallbackBg(ctx);
      }
    } else {
      fillFallbackBg(ctx);
    }

    // 2. 하단 45% 암전 다크 그라데이션
    const grad = ctx.createLinearGradient(0, 480, 0, 1080);
    grad.addColorStop(0, "rgba(11, 17, 32, 0)");
    grad.addColorStop(0.5, "rgba(11, 17, 32, 0.75)");
    grad.addColorStop(1, "rgba(11, 17, 32, 0.98)");
    ctx.fillStyle = grad;
    ctx.fillRect(0, 480, 1080, 600);

    // 3. 상단 페이지 번호 (1/5)
    ctx.fillStyle = "rgba(255, 255, 255, 0.5)";
    ctx.font = "bold 26px Pretendard";
    ctx.textAlign = "right";
    ctx.fillText(`${currentSlideIndex + 1} / 5`, 1000, 90);

    // 4. 카테고리 뱃지 박스 (호환성 보장)
    drawBadge(ctx, 80, 620, slide.badge);

    // 5. 메인 헤드라인
    ctx.textAlign = currentAlign;
    ctx.font = `900 ${currentFontSize}px Pretendard`;
    ctx.shadowColor = "rgba(0,0,0,0.9)";
    ctx.shadowBlur = 18;

    let posX = currentAlign === 'center' ? 540 : 80;
    let lineHeight = currentFontSize * 1.25;
    let startY = currentPos === 'top' ? 240 : (currentPos === 'center' ? 520 : 750);

    const lines = slide.title.split('\n');
    lines.forEach((line, i) => {
      ctx.fillStyle = (i === lines.length - 1) ? "#FFDF38" : "#FFFFFF";
      ctx.fillText(line, posX, startY + (i * lineHeight));
    });

    // 6. 서브 설명문
    ctx.shadowBlur = 0;
    ctx.fillStyle = "#94A3B8";
    ctx.font = "500 28px Pretendard";
    ctx.fillText(slide.sub, posX, startY + (lines.length * lineHeight) + 24);
  }

  function fillFallbackBg(ctx) {
    const bgGrad = ctx.createLinearGradient(0, 0, 1080, 1080);
    bgGrad.addColorStop(0, "#1e293b");
    bgGrad.addColorStop(1, "#0f172a");
    ctx.fillStyle = bgGrad;
    ctx.fillRect(0, 0, 1080, 1080);
    
    // 은은한 배경 원형 조명 효과
    ctx.fillStyle = "rgba(37, 99, 235, 0.12)";
    ctx.beginPath();
    ctx.arc(540, 380, 320, 0, Math.PI * 2);
    ctx.fill();
  }

  function drawBadge(ctx, x, y, text) {
    ctx.save();
    ctx.fillStyle = "rgba(59, 130, 246, 0.3)";
    ctx.strokeStyle = "rgba(59, 130, 246, 0.8)";
    ctx.lineWidth = 2;
    // 사각형 뱃지
    ctx.fillRect(x, y, 190, 48);
    ctx.strokeRect(x, y, 190, 48);
    ctx.fillStyle = "#FFFFFF";
    ctx.font = "bold 22px Pretendard";
    ctx.textAlign = "center";
    ctx.fillText(text, x + 95, y + 32);
    ctx.restore();
  }

  function switchSlide(idx, btn) {
    document.querySelectorAll('.slide-tab').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentSlideIndex = idx;
    drawCanvas();
  }

  function changeFontSize(v) {
    currentFontSize = parseInt(v);
    document.getElementById('fontSizeDisplay').innerText = v + 'px';
    drawCanvas();
  }
  function setPos(p, btn) {
    btn.parentElement.querySelectorAll('.seg-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentPos = p;
    drawCanvas();
  }
  function setAlign(a, btn) {
    btn.parentElement.querySelectorAll('.seg-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentAlign = a;
    drawCanvas();
  }

  function updateCaption() {
    const text = document.getElementById('newsInput').value.substring(0, 100);
    const caption = `[전문가 경고 팩트 체크] ⚠️\n\n"${text}..."\n\n1장부터 5장까지 넘겨보시면서 건강 지키세요!\n👉 1번: 오늘부터 당장 술 끊는다\n👉 2번: 그래도 회식 땐 어쩔 수 없다\n\n댓글로 여러분의 생각을 남겨주세요!\n\n#카드뉴스 #건강정보 #혈당관리 #대장암예방 #생활상식`;
    document.getElementById('captionBox').innerText = caption;
  }

  function downloadCurrentSlide() {
    const canvas = document.getElementById('cardCanvas');
    const link = document.createElement('a');
    link.download = `slide_${currentSlideIndex + 1}.png`;
    link.href = canvas.toDataURL('image/png');
    link.click();
  }

  function copyCaption() {
    navigator.clipboard.writeText(document.getElementById('captionBox').innerText);
    alert("인스타그램 본문이 복사되었습니다!");
  }

  // 초기 시작 시 텍스트 폰트 로딩 대기 후 즉시 렌더링
  window.onload = () => {
    document.fonts.ready.then(() => {
      drawCanvas();
      updateCaption();
    });
  };
</script>
</body>
</html>
