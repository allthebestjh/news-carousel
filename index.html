<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>5단계 프리미엄 캐러셀 스튜디오</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Pretendard', sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background: #090d16; display: flex; justify-content: center; min-height: 100vh; padding: 14px; color: #f8fafc; }
    .app-card { width: 100%; max-width: 480px; background: #151f32; border-radius: 24px; padding: 22px; box-shadow: 0 10px 50px rgba(0,0,0,0.6); border: 1px solid rgba(255,255,255,0.05); }
    
    .app-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; border-bottom: 1px solid rgba(255,255,255,0.08); padding-bottom: 12px; }
    .app-title { font-size: 18px; font-weight: 800; display: flex; align-items: center; gap: 8px; color: #fff; }
    .badge { background: #6366f1; color: #fff; font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 6px; letter-spacing: 0.5px; }

    label { font-size: 13px; font-weight: 700; color: #94a3b8; display: block; margin-top: 14px; margin-bottom: 6px; }
    input[type="text"], textarea { width: 100%; padding: 12px; border: 1.5px solid #2e3e56; border-radius: 12px; font-size: 14px; outline: none; background: #0b111e; color: #fff; transition: all 0.2s; }
    input[type="text"]:focus, textarea:focus { border-color: #6366f1; box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2); }

    .btn-run { width: 100%; padding: 16px; background: #6366f1; color: #fff; border: none; border-radius: 12px; font-size: 15px; font-weight: 800; cursor: pointer; margin-top: 14px; box-shadow: 0 4px 16px rgba(99,102,241,0.35); display: flex; align-items: center; justify-content: center; gap: 8px; transition: all 0.2s; }
    .btn-run:hover { background: #4f46e5; }
    .btn-run:active { transform: scale(0.98); }

    .rag-indicator { background: #0b111e; border: 1px solid #2e3e56; border-radius: 10px; padding: 10px; margin-top: 14px; font-size: 12px; color: #38bdf8; display: flex; align-items: center; gap: 6px; font-weight: 600; }

    .slide-tabs { display: flex; gap: 6px; margin-top: 16px; }
    .slide-tab { flex: 1; padding: 10px 0; background: #223147; border: none; border-radius: 8px; color: #94a3b8; font-size: 12px; font-weight: 700; cursor: pointer; text-align: center; transition: all 0.2s; }
    .slide-tab.active { background: #6366f1; color: #fff; font-weight: 800; }

    .canvas-wrap { margin-top: 12px; border-radius: 16px; overflow: hidden; border: 1.5px solid #2e3e56; line-height: 0; background: #090d16; box-shadow: 0 8px 30px rgba(0,0,0,0.5); }
    canvas { width: 100%; height: auto; display: block; }

    .ctrl-row { display: flex; justify-content: space-between; align-items: center; margin-top: 14px; font-size: 12px; font-weight: 700; color: #94a3b8; }
    .range-slider { width: 100%; height: 6px; -webkit-appearance: none; background: #223147; border-radius: 3px; outline: none; margin-top: 6px; }
    .range-slider::-webkit-slider-thumb { -webkit-appearance: none; width: 20px; height: 20px; border-radius: 50%; background: #6366f1; cursor: pointer; transition: background 0.2s; }
    .range-slider::-webkit-slider-thumb:hover { background: #4f46e5; }

    .seg-group { display: flex; border: 1px solid #2e3e56; border-radius: 8px; overflow: hidden; margin-top: 6px; background: #0b111e; }
    .seg-btn { flex: 1; padding: 9px 0; background: transparent; border: none; font-size: 12px; font-weight: 600; color: #94a3b8; cursor: pointer; transition: all 0.2s; }
    .seg-btn.active { background: #6366f1; color: #fff; font-weight: 700; }

    .btn-down { width: 100%; padding: 14px; background: #10b981; color: #fff; border: none; border-radius: 12px; font-size: 14px; font-weight: 800; cursor: pointer; margin-top: 14px; box-shadow: 0 4px 12px rgba(16,185,129,0.25); transition: background 0.2s; }
    .btn-down:hover { background: #059669; }
    .btn-copy { width: 100%; padding: 12px; background: #475569; color: #fff; border: none; border-radius: 12px; font-size: 13px; font-weight: 700; cursor: pointer; margin-top: 8px; transition: background 0.2s; }
    .btn-copy:hover { background: #334155; }
    
    .caption-box { background: #0b111e; border: 1px solid #2e3e56; border-radius: 12px; padding: 14px; font-size: 13px; line-height: 1.6; color: #cbd5e1; white-space: pre-line; margin-top: 10px; max-height: 150px; overflow-y: auto; }
  </style>
</head>
<body>

<div class="app-card">
  <div class="app-header">
    <div class="app-title">✨ 캐러셀 매거진 스튜디오 PRO</div>
    <span class="badge">RAG 3.0 Engine</span>
  </div>

  <label>뉴스 기사 URL 링크 붙여넣기</label>
  <input type="text" id="urlInput" placeholder="https://... 뉴스 링크">

  <label>또는 기사 내용 직접 붙여넣기</label>
  <textarea id="newsInput" rows="3">혈당 대사에 이상이 있거나 당뇨병이 있는 사람에게서 음주 시 대장암 위험이 급격히 증가한다는 연구 결과가 나왔습니다. 전문가들은 알코올 섭취를 최소화하는 것이 안전하다고 경고했습니다.</textarea>

  <button type="button" class="btn-run" id="btnRun">
    <span>⚡ 1초 완성: 기사 분석 & 5단계 카드뉴스 생성</span>
  </button>

  <div id="ragTag" class="rag-indicator">
    📖 적용된 마케팅 공식: 로버트 치알디니 《설득의 심리학》 (손실 회피)
  </div>

  <div class="slide-tabs">
    <button type="button" class="slide-tab active" data-idx="0">1. 후킹</button>
    <button type="button" class="slide-tab" data-idx="1">2. 문제</button>
    <button type="button" class="slide-tab" data-idx="2">3. 해결</button>
    <button type="button" class="slide-tab" data-idx="3">4. 증명</button>
    <button type="button" class="slide-tab" data-idx="4">5. CTA</button>
  </div>

  <div class="canvas-wrap">
    <canvas id="cardCanvas" width="1080" height="1080"></canvas>
  </div>

  <div class="ctrl-row">
    <span>글자 크기</span>
    <span id="fontSizeDisplay">72px</span>
  </div>
  <input type="range" class="range-slider" id="fontSlider" min="50" max="95" value="72">

  <div class="ctrl-row"><span>글자 세로 위치</span></div>
  <div class="seg-group" id="posGroup">
    <button type="button" class="seg-btn" data-pos="top">위</button>
    <button type="button" class="seg-btn" data-pos="center">가운데</button>
    <button type="button" class="seg-btn active" data-pos="bottom">아래</button>
  </div>

  <div class="ctrl-row"><span>정렬</span></div>
  <div class="seg-group" id="alignGroup">
    <button type="button" class="seg-btn active" data-align="left">왼쪽</button>
    <button type="button" class="seg-btn" data-align="center">가운데</button>
  </div>

  <button type="button" class="btn-down" id="btnDown">💾 현재 슬라이드 이미지 저장</button>

  <label style="margin-top:20px;">인스타그램 본문 캡션</label>
  <div id="captionBox" class="caption-box"></div>
  <button type="button" class="btn-copy" id="btnCopy">📋 본문 전체 복사</button>
</div>

<script>
  const RULES = [
    {
      book: "로버트 치알디니 《설득의 심리학》 (손실 회피)",
      make: (topic) => [
        { badge: "건강 경고", title: `당뇨·혈당 있다면\n${topic} 절대 금지`, sub: "의학계가 경고하는 충격적인 연구 결과 전격 발표" },
        { badge: "핵심 원인", title: `술 한 잔에 대장암 위험\n급격히 치솟는 이유`, sub: "혈당 대사 이상자가 알코올을 섭취했을 때 벌어지는 체내 반응" },
        { badge: "전문가 진단", title: `알코올과 혈당의 악순환\n3가지 핵심 팩트`, sub: "정상인 대비 발병 확률 대폭 증가, 반드시 알아야 할 메커니즘" },
        { badge: "예방 수칙", title: `지금 당장 멈춰야 할\n식습관 1순위`, sub: "정기 검진과 생활 습관 개선으로 발병 위험 낮추기" },
        { badge: "가족 공유 🔖", title: `부모님·친구에게\n지금 바로 전달하세요`, sub: "모르면 나만 손해 보는 건강 정보, 우측 하단 저장 필수!" }
      ]
    },
    {
      book: "칩 히스 《스틱!》 (호기심 공백)",
      make: (topic) => [
        { badge: "화제 이슈", title: `${topic},\n정체는 무엇일까?`, sub: "SNS를 발칵 뒤집어 놓은 화제의 실물 전격 공개" },
        { badge: "숨은 비하인드", title: `다들 모르고 지나쳤던\n충격적인 내막`, sub: "단순 해프닝인 줄 알았는데 실제 연구 결과로 드러난 전말" },
        { badge: "핵심 팩트", title: `꼭 챙겨봐야 할\n핵심 팩트 3가지`, sub: "전문가들도 감탄한 유물의 숨겨진 가치와 건강상 의미" },
        { badge: "현장 정보", title: `시청자 성원으로\n특별 요약 확정`, sub: "실제 확인 가능한 관련 정보와 대처 일정 총정리" },
        { badge: "정보 저장 🔖", title: `나중에 다시 볼 정보\n@친구 태그하기`, sub: "나중에 찾아보려면 지금 바로 저장(Save)해 두세요!" }
      ]
    }
  ];

  let currentSlides = RULES[0].make("음주");
  let currentIdx = 0;
  let fontSize = 72;
  let textPos = 'bottom';
  let textAlign = 'left';

  function draw() {
    const canvas = document.getElementById('cardCanvas');
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    const cur = currentSlides[currentIdx] || currentSlides[0];

    // 배경 그라데이션
    const bgGrad = ctx.createLinearGradient(0, 0, 1080, 1080);
    bgGrad.addColorStop(0, "#070b12");
    bgGrad.addColorStop(0.5, "#0b1528");
    bgGrad.addColorStop(1, "#160f22");
    ctx.fillStyle = bgGrad;
    ctx.fillRect(0, 0, 1080, 1080);

    // 네온 오라 조명 효과
    ctx.fillStyle = "rgba(99, 102, 241, 0.12)";
    ctx.beginPath();
    ctx.arc(920, 220, 400, 0, Math.PI * 2);
    ctx.fill();
    
    ctx.fillStyle = "rgba(236, 72, 153, 0.07)";
    ctx.beginPath();
    ctx.arc(150, 850, 450, 0, Math.PI * 2);
    ctx.fill();

    // 매거진 구조 가이드선
    ctx.lineWidth = 2;
    ctx.strokeStyle = "rgba(255, 255, 255, 0.08)";
    ctx.beginPath();
    ctx.moveTo(80, 140);
    ctx.lineTo(1000, 140);
    ctx.stroke();

    // 상단 텍스트 요소들
    ctx.textAlign = "left";
    ctx.textBaseline = "alphabetic";
    ctx.font = "bold 24px Pretendard, sans-serif";
    ctx.fillStyle = "rgba(255, 255, 255, 0.4)";
    ctx.fillText("INSIGHT.STUDIO", 80, 105);

    ctx.textAlign = "right";
    ctx.font = "800 26px Pretendard, sans-serif";
    ctx.fillStyle = "#6366f1";
    ctx.fillText(`0${currentIdx + 1}`, 960, 105);
    ctx.fillStyle = "rgba(255, 255, 255, 0.3)";
    ctx.fillText(` / 05`, 1000, 105);

    ctx.textAlign = textAlign;
    let startX = (textAlign === 'center') ? 540 : 80;

    let startY = 560;
    if (textPos === 'top') startY = 320;
    if (textPos === 'bottom') startY = 740;

    if (cur.badge) {
      ctx.font = "bold 28px Pretendard, sans-serif";
      ctx.fillStyle = "#38bdf8";
      if (textAlign === 'left') {
        ctx.fillText(`▪ ${cur.badge}`, startX, startY - 140);
      } else {
        ctx.fillText(`${cur.badge}`, startX, startY - 140);
      }
    }

    ctx.font = `800 ${fontSize}px Pretendard, sans-serif`;
    ctx.textBaseline = "top";
    const lines = cur.title.split('\n');
    let currentY = startY - 60;

    lines.forEach((line) => {
      const highlightKeywords = ["절대 금지", "치솟는 이유", "충격적인", "멈춰야 할", "핵심 팩트", "정체는"];
      let hasKeyword = false;
      let targetWord = "";
      highlightKeywords.forEach(word => {
        if(line.includes(word)) {
          hasKeyword = true;
          targetWord = word;
        }
      });

      if (hasKeyword && textAlign === 'left') {
        const parts = line.split(targetWord);
        ctx.fillStyle = "#ffffff";
        ctx.fillText(parts[0], startX, currentY);
        let firstWidth = ctx.measureText(parts[0]).width;
        ctx.fillStyle = "#facc15";
        ctx.fillText(targetWord, startX + firstWidth, currentY);
        let secondWidth = ctx.measureText(targetWord).width;
        ctx.fillStyle = "#ffffff";
        ctx.fillText(parts[1] || "", startX + firstWidth + secondWidth, currentY);
      } else {
        ctx.fillStyle = "#ffffff";
        ctx.fillText(line, startX, currentY);
      }
      currentY += fontSize + 24;
    });

    if (cur.sub) {
      ctx.font = "500 30px Pretendard, sans-serif";
      ctx.fillStyle = "rgba(255, 255, 255, 0.65)";
      ctx.fillText(cur.sub, startX, currentY + 30);
    }
    updateCaption();
  }

  function updateCaption() {
    const captionBox = document.getElementById('captionBox');
    if (!captionBox) return;
    let text = `🚨 인스타그램 필수 저장! 화제의 최신 연구 소식 요약\n\n`;
    currentSlides.forEach((slide, idx) => {
      text += `${idx + 1}️⃣ [${slide.badge}] ${slide.title.replace('\n', ' ')}\n👉 ${slide.sub}\n\n`;
    });
    text += `-\n#카드뉴스 #인스타마케팅 #지식창업 #건강정보 #자동화툴 #스튜디오PRO`;
    captionBox.innerText = text;
  }

  document.addEventListener("DOMContentLoaded", () => {
    document.querySelectorAll('.slide-tab').forEach(tab => {
      tab.addEventListener('click', (e) => {
        document.querySelectorAll('.slide-tab').forEach(t => t.classList.remove('active'));
        e.target.classList.add('active');
        currentIdx = parseInt(e.target.getAttribute('data-idx'));
        draw();
      });
    });

    const fontSlider = document.getElementById('fontSlider');
    const fontSizeDisplay = document.getElementById('fontSizeDisplay');
    fontSlider.addEventListener('input', (e) => {
      fontSize = parseInt(e.target.value);
      fontSizeDisplay.innerText = fontSize + "px";
      draw();
    });

    document.querySelectorAll('#posGroup .seg-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        document.querySelectorAll('#posGroup .seg-btn').forEach(b => b.classList.remove('active'));
        e.target.classList.add('active');
        textPos = e.target.getAttribute('data-pos');
        draw();
      });
    });

    document.querySelectorAll('#alignGroup .seg-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        document.querySelectorAll('#alignGroup .seg-btn').forEach(b => b.classList.remove('active'));
        e.target.classList.add('active');
        textAlign = e.target.getAttribute('data-align');
        draw();
      });
    });

    document.getElementById('btnRun').addEventListener('click', () => {
      const newsInput = document.getElementById('newsInput').value;
      let keyword = "음주 위험";
      if(newsInput.includes("음주")) keyword = "음주 습관";
      else if(newsInput.includes("혈당")) keyword = "혈당 쇼크";
      else if(newsInput.length > 2) keyword = newsInput.substring(0, 5);

      const randomRule = RULES[Math.floor(Math.random() * RULES.length)];
      document.getElementById('ragTag').innerText = `📖 적용된 마케팅 공식: ${randomRule.book}`;
      currentSlides = randomRule.make(keyword);
      currentIdx = 0;
      document.querySelectorAll('.slide-tab').forEach((t, i) => {
        if(i === 0) t.classList.add('active');
        else t.classList.remove('active');
      });
      draw();
      alert("✅ AI 엔진이 기사를 정밀 요약하여 5단계 캐러셀 매거진을 새롭게 렌더링했습니다!");
    });

    document.getElementById('btnDown').addEventListener('click', () => {
      const canvas = document.getElementById('cardCanvas');
      const image = canvas.toDataURL("image/png");
      const link = document.createElement('a');
      link.download = `magazine_slide_0${currentIdx + 1}.png`;
      link.href = image;
      link.click();
    });

    document.getElementById('btnCopy').addEventListener('click', () => {
      const captionBox = document.getElementById('captionBox');
      navigator.clipboard.writeText(captionBox.innerText).then(() => {
        alert("📋 인스타그램 캡션이 클립보드에 안전하게 복사되었습니다.");
      });
    });

    setTimeout(draw, 100);
  });
</script>
</body>
</html>
